name: Refresh Chennai air quality

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-and-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r chennai-air-quality-hourly/requirements.txt
      - run: python chennai-air-quality-hourly/src/collect.py --past-days 2
      - run: python chennai-air-quality-hourly/src/analyze.py
      - name: Publish aggregate data and report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f chennai-air-quality-hourly/data/chennai_hourly.csv
          git add -f chennai-air-quality-hourly/reports/findings.md chennai-air-quality-hourly/reports/*.csv chennai-air-quality-hourly/reports/*.png
          git diff --cached --quiet || { git commit -m "Refresh Chennai air-quality analysis"; git push; }
